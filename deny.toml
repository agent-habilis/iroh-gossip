[advisories]
ignore = [
    "RUSTSEC-2024-0436",
    "RUSTSEC-2026-0194",        # netdev unaffected
    "RUSTSEC-2026-0195",        # netdev unaffected
    # Unmaintained, with no fixed version and no known vulnerability. Path: tokio-rustls-acme
    # 0.9.1, through iroh-relay.
    { id = "RUSTSEC-2026-0543", reason = "chrono: unmaintained, no fixed version, no known vulnerability; via tokio-rustls-acme 0.9.1 (iroh-relay)" },
    # Unmaintained because it wraps chrono, with no fixed version and no known vulnerability.
    # Path: humantime-serde 1.1.1, only in the test-utils feature and the dev-dependencies.
    { id = "RUSTSEC-2026-0542", reason = "humantime: unmaintained (wraps chrono), no fixed version, no known vulnerability; via humantime-serde 1.1.1 (test-utils and dev only)" },
]

[bans]
deny = [
    "native-tls",
    "openssl",
]
multiple-versions = "allow"

[licenses]
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "Zlib",
    "Unicode-3.0",
    "Unlicense",
]

[[licenses.clarify]]
expression = "MIT AND ISC AND OpenSSL"
name = "ring"

[[licenses.clarify.license-files]]
hash = 3171872035
path = "LICENSE"

[sources]
allow-git = ["https://github.com/agent-habilis/iroh", "https://github.com/agent-habilis/net-tools", "https://github.com/agent-habilis/noq"]
